<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A3F58"/>
      <stop offset="1" stop-color="#15172A"/>
    </linearGradient>
    <linearGradient id="cool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FE3FF"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC24B"/>
      <stop offset="1" stop-color="#FF6A3D"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sheen)"/>
    <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="3"/>
  </g>
  <!-- tracks -->
  <g fill="#FFFFFF" fill-opacity="0.10">
    <rect x="262" y="250" width="100" height="524" rx="50"/>
    <rect x="462" y="250" width="100" height="524" rx="50"/>
    <rect x="662" y="250" width="100" height="524" rx="50"/>
  </g>
  <!-- levels -->
  <g filter="url(#glow)">
    <rect x="262" y="560" width="100" height="214" rx="50" fill="url(#cool)"/>
    <rect x="462" y="440" width="100" height="334" rx="50" fill="url(#cool)"/>
    <rect x="662" y="250" width="100" height="524" rx="50" fill="url(#hot)"/>
  </g>
  <!-- 100% line -->
  <line x1="214" y1="400" x2="810" y2="400" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 30"/>
</svg>
